name: Scalping tester browser smoke

on:
  push:
    branches:
      - feature/scalping-zec-near-vp-tester
    paths:
      - 'index.html'
      - 'backtester.js'
      - 'papertrader.js'
      - 'tests/**'
      - '.github/workflows/scalping-browser.yml'
  pull_request:
    branches:
      - feature/per-pair-timeframe-telegram-rules
    paths:
      - 'index.html'
      - 'backtester.js'
      - 'papertrader.js'
      - 'tests/**'
      - '.github/workflows/scalping-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright and Chromium
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/okx-static-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/okx-static-server.log
          exit 1
      - name: Run browser checks against real OKX market history
        run: node tests/scalping-browser.cjs
      - name: Upload browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalping-browser-report
          path: test-results/
          if-no-files-found: warn
