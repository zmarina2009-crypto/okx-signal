name: Recover stale GitHub Pages deployment lock

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/recover-pages-deployment-lock.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  request-pages-build:
    runs-on: ubuntu-latest
    steps:
      - name: Request a fresh build from the configured main branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
