name: Recover stale GitHub Pages deployment lock

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/recover-pages-deployment-lock.yml"

permissions:
  contents: read
  pages: write

jobs:
  cancel-stale-pages-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the stuck GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_SHA: 40c6d36b7f71d0e3292dd03e1d38c1e1604867f3
        shell: bash
        run: |
          set -euo pipefail
          echo "Cancelling stale Pages deployment $STALE_SHA"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments/$STALE_SHA/cancel"
