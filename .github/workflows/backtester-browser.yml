name: Backtester browser smoke test

on:
  push:
    branches:
      - feature/scalping-zec-near-vp-tester
  pull_request:
    branches:
      - feature/per-pair-timeframe-telegram-rules
    paths:
      - "index.html"
      - "backtester.js"
      - "papertrader.js"
      - "tests/browser/**"
      - ".github/workflows/backtester-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Chromium + live OKX candle history
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tester branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Start local static preview of this branch
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/okx-preview-http.log 2>&1 &
          echo $! > /tmp/okx-preview-http.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/okx-preview-http.log
          exit 1

      - name: Run browser smoke test with real OKX history
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4173
        run: python tests/browser/test_backtester_browser.py

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtester-browser-evidence
          path: |
            test-results/
            /tmp/okx-preview-http.log
          if-no-files-found: ignore
          retention-days: 14
